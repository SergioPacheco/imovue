name: Facebook - Imóveis do dia

on:
  # União de todos os slots possíveis (horário de Brasília +3h = UTC).
  # O script decide se "agora" é um slot ativo da grade configurada
  # (IMOVUE_FACEBOOK_POSTS_PER_DAY) e publica no máximo 1 post por execução.
  schedule:
    - cron: '30 12 * * *'  # 09:30 BRT
    - cron: '0 13 * * *'   # 10:00 BRT
    - cron: '30 14 * * *'  # 11:30 BRT
    - cron: '30 15 * * *'  # 12:30 BRT
    - cron: '30 17 * * *'  # 14:30 BRT
    - cron: '30 19 * * *'  # 16:30 BRT
    - cron: '0 22 * * *'   # 19:00 BRT
    - cron: '30 22 * * *'  # 19:30 BRT
    - cron: '0 23 * * *'   # 20:00 BRT
  workflow_dispatch:

concurrency:
  group: imovue-facebook-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Tokens de todas as páginas (Secrets inexistentes viram string vazia e a
    # UF é ignorada sem erro). Vale para o prune e para a publicação.
    env:
      META_PAGE_TOKEN_BR: ${{ secrets.META_PAGE_TOKEN_BR }}
      META_PAGE_TOKEN_AC: ${{ secrets.META_PAGE_TOKEN_AC }}
      META_PAGE_TOKEN_AL: ${{ secrets.META_PAGE_TOKEN_AL }}
      META_PAGE_TOKEN_AP: ${{ secrets.META_PAGE_TOKEN_AP }}
      META_PAGE_TOKEN_AM: ${{ secrets.META_PAGE_TOKEN_AM }}
      META_PAGE_TOKEN_BA: ${{ secrets.META_PAGE_TOKEN_BA }}
      META_PAGE_TOKEN_CE: ${{ secrets.META_PAGE_TOKEN_CE }}
      META_PAGE_TOKEN_DF: ${{ secrets.META_PAGE_TOKEN_DF }}
      META_PAGE_TOKEN_ES: ${{ secrets.META_PAGE_TOKEN_ES }}
      META_PAGE_TOKEN_GO: ${{ secrets.META_PAGE_TOKEN_GO }}
      META_PAGE_TOKEN_MA: ${{ secrets.META_PAGE_TOKEN_MA }}
      META_PAGE_TOKEN_MT: ${{ secrets.META_PAGE_TOKEN_MT }}
      META_PAGE_TOKEN_MS: ${{ secrets.META_PAGE_TOKEN_MS }}
      META_PAGE_TOKEN_MG: ${{ secrets.META_PAGE_TOKEN_MG }}
      META_PAGE_TOKEN_PA: ${{ secrets.META_PAGE_TOKEN_PA }}
      META_PAGE_TOKEN_PB: ${{ secrets.META_PAGE_TOKEN_PB }}
      META_PAGE_TOKEN_PR: ${{ secrets.META_PAGE_TOKEN_PR }}
      META_PAGE_TOKEN_PE: ${{ secrets.META_PAGE_TOKEN_PE }}
      META_PAGE_TOKEN_PI: ${{ secrets.META_PAGE_TOKEN_PI }}
      META_PAGE_TOKEN_RJ: ${{ secrets.META_PAGE_TOKEN_RJ }}
      META_PAGE_TOKEN_RN: ${{ secrets.META_PAGE_TOKEN_RN }}
      META_PAGE_TOKEN_RS: ${{ secrets.META_PAGE_TOKEN_RS }}
      META_PAGE_TOKEN_RO: ${{ secrets.META_PAGE_TOKEN_RO }}
      META_PAGE_TOKEN_RR: ${{ secrets.META_PAGE_TOKEN_RR }}
      META_PAGE_TOKEN_SC: ${{ secrets.META_PAGE_TOKEN_SC }}
      META_PAGE_TOKEN_SP: ${{ secrets.META_PAGE_TOKEN_SP }}
      META_PAGE_TOKEN_SE: ${{ secrets.META_PAGE_TOKEN_SE }}
      META_PAGE_TOKEN_TO: ${{ secrets.META_PAGE_TOKEN_TO }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      IMOVUE_FACEBOOK_TIMEZONE: America/Sao_Paulo
      IMOVUE_FACEBOOK_POSTS_PER_DAY: '3'
      IMOVUE_FACEBOOK_REPOST_AFTER_DAYS: '30'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências sociais
        run: python -m pip install -r requirements-social.txt

      - name: Remover posts de imóveis fora do catálogo
        # Não bloqueia a publicação se a limpeza falhar.
        continue-on-error: true
        run: python tools/social/prune_stale.py

      - name: Publicar oportunidade do slot
        # Publica em todas as páginas habilitadas (enabled + pageId + token).
        # UFs sem configuração são ignoradas sem erro.
        run: python tools/social/post_daily.py --all --publish

      - name: Persistir histórico de publicações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # O arquivo muda tanto na limpeza (status removed) quanto na publicação.
          if [ -f social/published.json ]; then
            git add social/published.json
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(social): registrar publicações diárias"
            git push
          else
            echo "Nenhum histórico novo para persistir."
          fi
