name: Facebook - Imóveis do dia

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

concurrency:
  group: imovue-facebook-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências sociais
        run: python -m pip install -r requirements-social.txt

      - name: Publicar oportunidades
        env:
          META_PAGE_TOKEN_BR: ${{ secrets.META_PAGE_TOKEN_BR }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        # Página nacional piloto. Trocar para --all quando as páginas estaduais forem habilitadas.
        run: python tools/social/post_daily.py --uf BR --publish

      - name: Persistir histórico de publicações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # O arquivo só é criado quando uma publicação é concluída.
          if [ -f social/published.json ]; then
            git add social/published.json
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(social): registrar publicações diárias"
            git push
          else
            echo "Nenhum histórico novo para persistir."
          fi
