name: Facebook - Imóveis do dia

on:
  # União de todos os slots possíveis (horário de Brasília +3h = UTC).
  # O script decide se "agora" é um slot ativo da grade configurada
  # (IMOVUE_FACEBOOK_POSTS_PER_DAY) e publica no máximo 1 post por execução.
  schedule:
    - cron: '30 12 * * *'  # 09:30 BRT
    - cron: '0 13 * * *'   # 10:00 BRT
    - cron: '30 14 * * *'  # 11:30 BRT
    - cron: '30 15 * * *'  # 12:30 BRT
    - cron: '30 17 * * *'  # 14:30 BRT
    - cron: '30 19 * * *'  # 16:30 BRT
    - cron: '0 22 * * *'   # 19:00 BRT
    - cron: '30 22 * * *'  # 19:30 BRT
    - cron: '0 23 * * *'   # 20:00 BRT
  workflow_dispatch:

concurrency:
  group: imovue-facebook-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Token único do System User (sem expiração, com acesso a todas as páginas
    # do Business). Secret inexistente vira string vazia e as UFs são ignoradas
    # sem erro. Vale para o prune e para a publicação.
    env:
      FB_SYSTEM_USER_TOKEN: ${{ secrets.FB_SYSTEM_USER_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      IMOVUE_FACEBOOK_TIMEZONE: America/Sao_Paulo
      IMOVUE_FACEBOOK_POSTS_PER_DAY: '3'
      IMOVUE_FACEBOOK_REPOST_AFTER_DAYS: '30'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências sociais
        run: python -m pip install -r requirements-social.txt

      - name: Remover posts de imóveis fora do catálogo
        # Não bloqueia a publicação se a limpeza falhar.
        continue-on-error: true
        run: python tools/social/prune_stale.py

      - name: Publicar oportunidade do slot
        # Publica em todas as páginas habilitadas (enabled + pageId + token).
        # UFs sem configuração são ignoradas sem erro.
        run: python tools/social/post_daily.py --all --publish

      - name: Persistir histórico de publicações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # O arquivo muda tanto na limpeza (status removed) quanto na publicação.
          if [ -f social/published.json ]; then
            git add social/published.json
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(social): registrar publicações diárias"
            git push
          else
            echo "Nenhum histórico novo para persistir."
          fi
