name: Atualizar dados dos imóveis

on:
  schedule:
    - cron: '0 9 * * 1'  # toda segunda às 9h UTC (6h BRT)
  workflow_dispatch:       # permite rodar manualmente pelo GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install playwright && playwright install chromium --with-deps

      - name: Baixar CSVs da Caixa
        run: python tools/download_caixa.py
        continue-on-error: true

      - name: Gerar JSONs
        run: python tools/csv_to_json.py

      - name: Validar dados gerados
        run: python tools/validate_data.py

      - name: Commit e push se houve mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/ data/listas/
          git diff --staged --quiet || git commit -m "chore(data): atualizar imóveis $(date +%Y-%m-%d)"
          git push
