name: Atualizar dados dos imóveis

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install playwright && playwright install chromium --with-deps

      - name: Baixar CSVs da Caixa
        run: python tools/download_caixa.py
        continue-on-error: true

      - name: Gerar JSONs
        run: python tools/csv_to_json.py

      - name: Commit dados brutos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/ data/listas/
          git diff --staged --quiet || git commit -m "chore(data): atualizar CSVs e JSONs $(date +%Y-%m-%d)"
          git push

  geocode:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: "Geocodificar ${{ matrix.uf }}"
        run: python tools/geocode.py ${{ matrix.uf }}

      - name: Commit geolocalização ${{ matrix.uf }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/${{ matrix.uf }}.json tools/.geocode_cache.json
          if git diff --staged --quiet; then
            echo "Sem mudanças para ${{ matrix.uf }}"
            exit 0
          fi
          git commit -m "chore(data): geocode ${{ matrix.uf }} $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Retry $i..."
            sleep $((i * 5))
          done

  validate:
    needs: geocode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar dados
        run: python tools/validate_data.py
