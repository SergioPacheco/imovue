name: Atualizar dados dos imóveis

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Baixar CSVs da Caixa
        run: python tools/download_caixa.py
        continue-on-error: true

      - name: Gerar JSONs
        run: python tools/csv_to_json.py

      - name: Validar dados
        run: python tools/validate_data.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Os CSVs brutos em data/listas/ são ignorados de propósito.
          # Só os JSONs entram aqui; a geocodificação roda desacoplada
          # em geocode.yml (1 job por UF) e commita lat/lng depois.
          git add frontend/public/data/
          git diff --staged --quiet || git commit -m "chore(data): atualizar imóveis $(date +%Y-%m-%d)"
          git push
