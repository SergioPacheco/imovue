name: Atualizar dados dos imóveis

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache do geocode entre runs (evita re-requests ao Nominatim)
      - name: Restaurar cache de geocodificação
        uses: actions/cache@v4
        with:
          path: tools/.geocode_cache.json
          key: geocode-cache-${{ github.run_number }}
          restore-keys: |
            geocode-cache-

      - name: Instalar dependências
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Baixar CSVs da Caixa
        run: python tools/download_caixa.py
        continue-on-error: true

      - name: Gerar JSONs
        run: python tools/csv_to_json.py

      - name: Geocodificar (por bairro — otimizado)
        run: python tools/geocode.py

      - name: Validar dados
        run: python tools/validate_data.py

      - name: Gerar sitemap
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node frontend/scripts/generate-sitemap.js
        working-directory: .

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/ data/listas/ tools/.geocode_cache.json frontend/dist/sitemap*.xml
          git diff --staged --quiet || git commit -m "chore(data): atualizar imóveis $(date +%Y-%m-%d)"
          git push
